name: Backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dipbuy/**"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m dipbuy.backtest backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: backtest.json
